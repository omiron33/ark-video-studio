<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motion references · Ark</title>
<style>
:root{color-scheme:dark;--bg:#10191a;--panel:#172123;--line:#354143;--ink:#eee7d7;--muted:#a7b5b1;--accent:#ef936d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}header{padding:24px 4vw;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font:28px Georgia,serif}.brand span{font:10px system-ui,sans-serif;letter-spacing:3px;color:var(--muted);margin-left:18px}header small{color:var(--muted)}main{padding:44px 4vw 80px;max-width:2400px;margin:auto}.intro{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:30px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--accent);text-transform:uppercase}h1{font:clamp(36px,4vw,58px)/1.12 Georgia,serif;margin:10px 0 16px}p{margin:0;color:var(--muted)}.intro p{max-width:640px}.search{display:flex;gap:8px;min-width:min(100%,460px)}input{width:100%;padding:15px 18px;background:#0c1415;border:1px solid var(--line);border-radius:3px;color:var(--ink)}.search button,.filter,dialog button.close{border:1px solid var(--line);background:transparent;color:var(--ink);padding:12px 18px;border-radius:3px}.search button{background:var(--accent);color:#10191a;border-color:var(--accent);font-weight:650}.toolbar{display:flex;align-items:center;gap:8px;margin:30px 0 22px;flex-wrap:wrap}.filter{font-size:13px;padding:7px 14px}.filter[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}#count{margin-left:auto;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}.card{display:flex;flex-direction:column;min-width:0}.open-card{padding:0;border:1px solid var(--line);background:#080d0e;color:inherit;text-align:left;overflow:hidden;border-radius:3px}.open-card:hover{border-color:var(--accent)}.card img{width:100%;display:block;aspect-ratio:16/10;object-fit:contain}.caption{padding:18px 0}.source{color:var(--accent);font-size:10px;letter-spacing:1.4px;text-transform:uppercase}h2{font:25px/1.2 Georgia,serif;margin:8px 0 12px}.caption p{font-size:13px;line-height:1.6}.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tag{font-size:11px;border-bottom:1px solid var(--line);padding:2px 0;color:var(--muted)}#status{color:var(--muted);min-height:24px;font-size:13px;margin-bottom:12px}.empty{grid-column:1/-1;padding:80px 20px;border:1px solid var(--line);text-align:center}.empty h2{font-size:30px}.empty p{max-width:500px;margin:auto}dialog{color:var(--ink);background:var(--bg);border:1px solid var(--line);width:min(1500px,94vw);max-height:92vh;padding:28px}dialog::backdrop{background:#000c}.dialog-head{display:flex;justify-content:space-between;gap:20px;align-items:start;margin-bottom:20px}dialog h2{font-size:34px}dialog .close{white-space:nowrap}.detail-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:28px}.detail-image{width:100%;height:auto;background:#080d0e;border:1px solid var(--line)}.detail-copy h3{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--accent);margin:24px 0 8px}.detail-copy h3:first-child{margin-top:0}.detail-copy p,.detail-copy li{font-size:14px;line-height:1.65;color:var(--muted)}.detail-copy ul{padding-left:20px;margin:6px 0}.source-info{font-size:12px;overflow-wrap:anywhere;color:var(--muted);margin-top:15px}a{color:var(--accent)}.frames{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.frames img{width:100%;display:block}.frames figure{margin:0}.frames figcaption{font:11px ui-monospace,monospace;color:var(--muted);padding-top:4px}#detail-title:focus{outline:none}@media(min-width:2100px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:1150px){.intro{display:block}.search{margin-top:24px;max-width:700px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.detail-grid{grid-template-columns:1fr}}@media(max-width:650px){header{padding:20px}.brand span{margin-left:10px}header small{display:none}main{padding:28px 20px 50px}.grid{grid-template-columns:1fr;gap:20px}.search{min-width:0}.search button{padding:10px 14px}.toolbar{gap:6px}.filter{padding:7px 10px}#count{width:100%;margin:8px 0 0}.card img{aspect-ratio:auto}dialog{padding:18px}dialog h2{font-size:26px}.dialog-head{display:grid;grid-template-columns:1fr auto;gap:12px}.dialog-head>div{grid-column:1/-1;grid-row:2}.dialog-head .close{grid-column:2;grid-row:1;padding:8px 14px}.frames{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header><div class="brand">Ark <span>LYRIC STUDIO</span></div><small>A growing visual vocabulary</small></header>
<main><div class="intro"><div><div class="eyebrow">The reference library</div><h1>Ideas to move a story.</h1><p>Moments from our films and the work that inspires us. Explore a principle, follow its source, imagine where it could go next.</p></div><form class="search" id="search"><label for="query" hidden>Search motion ideas</label><input id="query" type="search" placeholder="Try “lineage”, “tension”, or “transformation”" aria-label="Search motion ideas"><button>Search</button></form></div>
<div class="toolbar"><button class="filter" data-kind="all" aria-pressed="true">All references</button><button class="filter" data-kind="internal" aria-pressed="false">Our films</button><button class="filter" data-kind="external" aria-pressed="false">Outside inspiration</button><span id="count"></span></div>
<div id="status" role="status" aria-live="polite">Loading reference images…</div><div id="grid" class="grid"></div></main>
<dialog id="detail" aria-labelledby="detail-title"><div class="dialog-head"><div><div class="source" id="detail-source"></div><h2 id="detail-title" tabindex="-1"></h2></div><button type="button" class="close" id="close">Close</button></div><div class="detail-grid"><div><img id="detail-sheet" class="detail-image" alt=""><div id="detail-frames" class="frames"></div><div id="detail-origin" class="source-info"></div></div><div id="detail-copy" class="detail-copy"></div></div></dialog>
<script type="module">
const $=id=>document.getElementById(id),el=(tag,text,className)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(className)e.className=className;return e;};
const media=p=>'/media?path='+encodeURIComponent(p),time=s=>`${Math.floor(s/60)}:${(s%60).toFixed(2).padStart(5,'0')}`;
let cards=[],kind='all',requestId=0;
function show(card){
  $('detail-title').textContent=card.title;$('detail-source').textContent=`${card.source.kind==='internal'?'Our films':'Outside inspiration'} · ${time(card.source.start)}–${time(card.source.end)}`;
  $('detail-sheet').src=media(card.contactSheet);$('detail-sheet').alt=card.title+' — sampled sequence';
  $('detail-frames').replaceChildren(...card.frames.map(f=>{const figure=el('figure'),img=el('img');img.src=media(f.path);img.alt=`${card.title} at ${time(f.timeSeconds)}`;figure.append(img,el('figcaption',time(f.timeSeconds)));return figure;}));
  const origin=$('detail-origin');origin.replaceChildren();
  if(card.source.url){const link=el('a','Open original source ↗');link.href=card.source.url;link.target='_blank';link.rel='noopener noreferrer';origin.append(link);}
  if(card.source.creator)origin.append(el('div',card.source.creator));
  if(card.source.path)origin.append(el('div',card.source.path));
  origin.append(el('div',`Reference ${card.id} · ${card.quality.status} · preference: ${card.quality.userPreference}${card.quality.userPreferenceScope?' ('+card.quality.userPreferenceScope+')':''}`));
  const copy=$('detail-copy');copy.replaceChildren();
  const block=(title,body)=>{copy.append(el('h3',title));if(Array.isArray(body)){const ul=el('ul');ul.append(...body.map(t=>el('li',t)));copy.append(ul);}else copy.append(el('p',body));};
  block('The transferable idea',card.motion.transferablePrinciple);block('What unfolds',card.motion.phases);block('Where it fits',card.intent);block('New directions',card.motion.variations);block('Observed strengths',card.quality.strengths);block('Use with care',[...card.motion.cautions,...card.quality.limitations]);
  if(card.fit)block('Why this matched',card.fit.matchedConcepts?.map(m=>`${m.queryTerm} → ${m.referenceTerm}`).join(', ')||'Related visual vocabulary');
  $('detail').showModal();$('detail-title').focus();
}
function render(){
  const visible=cards.filter(c=>kind==='all'||c.source.kind===kind);$('count').textContent=`${visible.length} ${visible.length===1?'reference':'references'}`;
  $('grid').replaceChildren(...visible.map(card=>{const article=el('article',undefined,'card'),button=el('button',undefined,'open-card'),img=el('img');button.type='button';button.setAttribute('aria-label','Inspect '+card.title);img.src=media(card.contactSheet);img.alt=card.title+' — sampled sequence';img.loading='lazy';button.append(img);button.onclick=()=>show(card);const caption=el('div',undefined,'caption');caption.append(el('div',`${card.source.kind==='internal'?'Our films':'Outside inspiration'} · ${time(card.source.start)}–${time(card.source.end)}`,'source'),el('h2',card.title),el('p',card.motion.transferablePrinciple));const tags=el('div',undefined,'tags');tags.append(...card.tags.slice(0,4).map(t=>el('span',t,'tag')));caption.append(tags);article.append(button,caption);return article;}));
  if(!visible.length){const empty=el('div',undefined,'empty');empty.append(el('h2','Room for a new idea.'),el('p','No matching references. Try another concept or clear the search to browse the library.'));$('grid').append(empty);}
}
async function search(){const id=++requestId,q=$('query').value.trim();$('status').textContent='Searching visual ideas…';try{const response=await fetch('/api/references?q='+encodeURIComponent(q));if(!response.ok)throw Error('Could not load the reference library.');const data=await response.json();if(id!==requestId)return;cards=data.cards;render();$('status').textContent=data.warnings.length?`${data.warnings.length} reference records need attention. Valid references are shown.`:q?(cards.length?'Matched by concept and visual vocabulary. Open a reference to explore.':'No relevant match for this search.'):'Each sequence contains real frames from its source. Notes describe observed ideas, not a blanket quality score.';}catch(error){if(id===requestId)$('status').textContent=error.message;}}
$('search').onsubmit=e=>{e.preventDefault();search();};$('query').addEventListener('search',search);
document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render();});
$('close').onclick=()=>$('detail').close();$('detail').addEventListener('click',e=>{if(e.target===$('detail')){const r=$('detail').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('detail').close();}});search();
</script></body></html>
